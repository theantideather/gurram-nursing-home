    const LanguageContext = React.createContext(null);

    function LanguageProvider({ children }) {
      const [lang, setLang] = useState(() => {
        try {
          return localStorage.getItem("agnh-lang") || "en";
        } catch (e) {
          return "en";
        }
      });
      useEffect(() => {
        try {
          localStorage.setItem("agnh-lang", lang);
        } catch (e) {}
        document.documentElement.lang = lang === "mr" ? "mr" : "en";
      }, [lang]);
      const t = useCallback(
        (key) => TRANSLATIONS[lang][key] || TRANSLATIONS.en[key] || key,
        [lang]
      );
      return (
        <LanguageContext.Provider value={{ lang, setLang, t }}>
          {children}
        </LanguageContext.Provider>
      );
    }

    function useLang() {
      return React.useContext(LanguageContext);

    /* ─── FadingVideo ─── */
    function FadingVideo({ src, className, style }) {
      const videoRef = useRef(null);
      const rafRef = useRef(null);
      const fadingOutRef = useRef(false);

      const fadeTo = useCallback((target, duration) => {
        const video = videoRef.current;
        if (!video) return;
        if (rafRef.current) cancelAnimationFrame(rafRef.current);
        const startOpacity = parseFloat(video.style.opacity) || 0;
        const startTime = performance.now();
        const step = (now) => {
          const t = Math.min((now - startTime) / duration, 1);
          video.style.opacity = String(startOpacity + (target - startOpacity) * t);
          if (t < 1) rafRef.current = requestAnimationFrame(step);
          else rafRef.current = null;
        };
        rafRef.current = requestAnimationFrame(step);
      }, []);

      useEffect(() => {
        const video = videoRef.current;
        if (!video) return;

        const onLoadedData = () => {
          video.style.opacity = "0";
          video.play().catch(() => {});
          fadeTo(1, FADE_MS);
        };

        const onTimeUpdate = () => {
          if (fadingOutRef.current) return;
          if (video.duration && video.duration - video.currentTime <= FADE_OUT_LEAD) {
            fadingOutRef.current = true;
            fadeTo(0, FADE_MS);
          }
        };

        const onEnded = () => {
          fadingOutRef.current = false;
          video.style.opacity = "0";
          setTimeout(() => {
            video.currentTime = 0;
            video.play().catch(() => {});
            fadeTo(1, FADE_MS);
          }, 100);
        };

        video.addEventListener("loadeddata", onLoadedData);
        video.addEventListener("timeupdate", onTimeUpdate);
        video.addEventListener("ended", onEnded);

        return () => {
          if (rafRef.current) cancelAnimationFrame(rafRef.current);
          video.removeEventListener("loadeddata", onLoadedData);
          video.removeEventListener("timeupdate", onTimeUpdate);
          video.removeEventListener("ended", onEnded);
        };
      }, [fadeTo]);

      return (
        <video
          ref={videoRef}
          src={src}
          autoPlay
          muted
          playsInline
          preload="auto"
          className={className}
          style={{ ...style, opacity: 0 }}
        />
      );
    }
    window.FadingVideo = FadingVideo;

    /* ─── BlurText ─── */
    function BlurText({ text, className = "", delay = 0 }) {
      const ref = useRef(null);
      const [inView, setInView] = useState(false);
      const words = text.split(/\s+/).filter(Boolean);

      useEffect(() => {
        const el = ref.current;
        if (!el) return;
        const observer = new IntersectionObserver(
          ([entry]) => {
            if (entry.isIntersecting) {
              setInView(true);
              observer.disconnect();
            }
          },
          { threshold: 0.1 }
        );
        observer.observe(el);
        return () => observer.disconnect();
      }, []);

      return (
        <span ref={ref} className={className}>
          {words.map((word, i) => (
            <motion.span
              key={i}
              initial={{ filter: "blur(10px)", opacity: 0, y: 50 }}
              animate={
                inView
                  ? {
                      filter: ["blur(10px)", "blur(5px)", "blur(0px)"],
                      opacity: [0, 0.5, 1],
                      y: [50, 0, 0],
                    }
                  : { filter: "blur(10px)", opacity: 0, y: 50 }
              }
              transition={{
                duration: 0.7,
                delay: delay + i * 0.1,

    function Gauge({ value, color = "#ef4d23", showLabels = false, min = "0", max = "100" }) {
      const tickCount = 40;
      const activeCount = Math.round((value / 100) * tickCount);
      return (
        <div className="gauge max-w-[260px] mx-auto">
          <svg viewBox="0 0 200 120" className="w-full h-auto" aria-hidden="true">
            {Array.from({ length: tickCount }).map((_, index) => {
              const angle = Math.PI + (Math.PI * index) / (tickCount - 1);
              const x1 = 100 + Math.cos(angle) * 70;
              const y1 = 100 + Math.sin(angle) * 70;
              const x2 = 100 + Math.cos(angle) * 80;
              const y2 = 100 + Math.sin(angle) * 80;
              return (
                <line
                  key={index}
                  x1={x1}
                  y1={y1}
                  x2={x2}
                  y2={y2}
                  stroke={index < activeCount ? color : "#d4d4d8"}
                  strokeWidth="2.5"
                  strokeLinecap="round"
                />
              );
            })}
            <text x="100" y="105" textAnchor="middle" fontSize="22" fontWeight="600" fill="#0b0f1a">
              {value}%
            </text>
          </svg>
          {showLabels ? (
            <div className="mt-3 flex justify-between text-[11px] text-neutral-500">
              <span>{min}</span>
              <span>{max}</span>
            </div>
          ) : null}
        </div>
      );

              <a href={CONTACT.instagram} target="_blank" rel="noopener noreferrer" className="text-[#81D8D0] hover:text-white">{t("instagram")} {CONTACT.instagramHandle}</a>
              <a href={CONTACT.mapsDirections} target="_blank" rel="noopener noreferrer" className="text-[#81D8D0] hover:text-white">{t("googleMaps")}</a>
              <a href={`mailto:${CONTACT.email}`} className="text-[#81D8D0] hover:text-white">{t("email")}</a>
            </div>
          </div>
        </section>
      );
    }
    window.Contact = Contact;

    function App() {
      return (
        <LanguageProvider>
          <Hero />
          <LocationMap />
          <Services />
          <MeetOurTeam />
          <TeamDetails />
          <Blogs />
          <IVFCamp />
          <Contact />
        </LanguageProvider>
      );
    }
    window.App = App;

    createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
